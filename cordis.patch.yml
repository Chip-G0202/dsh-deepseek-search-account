# Bundle layer for dsh-deepseek-search-account.
#
# Registers the account-backed DeepSeek providers on the `web` seam and pins
# BOTH capabilities to them, so the built-in `web_search` and `web_fetch` tools
# keep working when the session's chat model is NOT a DeepSeek Account model
# (OpenCode Go, other third-party gateways) — search and page fetching then run
# on the signed-in DeepSeek account through the official Search / Fetch API.
#
# Override the provider row from the profile patch with an id-targeted entry
# that repeats `name: dsh-deepseek-search-account`:
#
#   - id: web-search-deepseek-account
#     name: dsh-deepseek-search-account
#     config:
#       mode: search-api
#       count: 8
- insert:
    - id: web-search-deepseek-account
      name: dsh-deepseek-search-account
      config:
        mode: search-api
        count: 10
        sendOriginalQuestion: true
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-account-search
    # Restated because a patch replaces the row's whole config: without it the
    # registered fetch providers (http + DeepSeek fetch API) would be ambiguous
    # and `web_fetch` would fail until one is pinned.
    fetchProvider: deepseek-account-fetch
